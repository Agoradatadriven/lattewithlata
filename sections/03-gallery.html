<!-- 03-gallery - Bleed-right cafe gallery carousel (6 portraits). SOURCE: Paszkowski P2 carousel 1
     (PZ source/rendered.html div[data-id="161"] > .container > div[data-id="270"].strip__data.anima--fade > #splide02.strip__gallery.splide).
     Arrows are injected by carousel.js (initCarousel); no lightbox link (Fancybox dropped, DD Pick 6 "Change") so the
     hover-zoom hook .strip__gallery__link is a <figure>. Copy/alt: content/site.json gallery[] + content/assets-manifest.json (alt wins). -->
<section id="s-03-gallery" class="strip strip__gallery--slider js-splide-arrows carousel strip--wide mb-md gallery">
  <div class="container">
    <div class="strip__data anima--fade">
      <div class="strip__gallery splide" data-splide-sizes='{"all":2,"576":3,"800":3}' aria-label="Cafe gallery">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-01.jpg" width="1200" height="1800" alt="Cafe interior with a dark leather banquette, wooden tables and a copper pendant lamp" loading="eager" decoding="async">
              </figure>
            </li>
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-02.jpg" width="1200" height="1800" alt="Barista pouring steamed milk into a cup to form latte art" loading="eager" decoding="async">
              </figure>
            </li>
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-03.jpg" width="1200" height="1800" alt="Croissants and pastries on a marble board in a bakery display case" loading="eager" decoding="async">
              </figure>
            </li>
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-04.jpg" width="1200" height="1800" alt="Condenser microphone on a desk with guitars hanging on the wall behind" loading="lazy" decoding="async">
              </figure>
            </li>
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-05.jpg" width="1200" height="1800" alt="Cup of coffee with rosetta latte art on a wooden table" loading="lazy" decoding="async">
              </figure>
            </li>
            <li class="splide__slide strip__gallery__item">
              <figure class="strip__gallery__link">
                <img src="assets/images/gallery-06.jpg" width="1200" height="1800" alt="Cafe bar counter with a large lampshade and staff working behind it" loading="lazy" decoding="async">
              </figure>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
