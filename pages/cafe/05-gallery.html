<!-- cafe 05-gallery - the bleed-right Splide rail of home 03 through the shared carousel contract ([data-carousel] + data-splide-sizes; arrows,

     home gallery-01..06; FINAL PASS: the three photos already shown above (cafe-02, cafe-03 in #story, gallery-01 in #room) sit late in the rail, not in the first view. Alt + size: assets-manifest (manifest wins). -->
